[package]
name = "gba-llvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# The crate's LLVM emitter is exercised by native ABI fixture scripts. An
# otherwise empty libtest binary retains LLVM's C++ runtime dylibs and cannot
# start on the supported macOS toolchain without overriding process-global
# dylib lookup.
[lib]
test = false
doctest = false

[dependencies]
gba-ir.workspace = true
gba-runtime-abi.workspace = true
llvm-sys.workspace = true

# The official Windows LLVM build names zstd and zlib libraries from its
# build machine (llvm-config --system-libs); these compile them from source.
[target.'cfg(windows)'.dependencies]
zstd-sys = { version = "2", default-features = false }
libz-sys = { version = "1", default-features = false, features = ["static"] }

[lints]
workspace = true
