// Generated by gba-recomp (SPEC-068). The native code is prebuilt:
// jniLibs/arm64-v8a holds libSDL3.so and libmain.so (game + runtime).
plugins {
    id "com.android.application"
}

android {
    namespace "dev.gbarecomp.game"
    compileSdk 35

    defaultConfig {
        applicationId "{{APPLICATION_ID}}"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "{{VERSION}}"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // Debug signing: installable for testing, not for a store.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Prebuilt libraries are kept as linked (no NDK needed here).
            keepDebugSymbols += ["**/*.so"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
