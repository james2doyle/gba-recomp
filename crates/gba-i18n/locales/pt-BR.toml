_version = 1

# Textos do frontend (SPEC-069 L10N-69-01). Chaves planas: `secao.chave`.
# Este é o idioma padrão e o fallback de qualquer chave ausente.
#
# Duas restrições valem para TODO valor deste arquivo, em qualquer idioma:
# 1. TOML: `menu.page.video` não pode conviver com `menu.page` (mesma colisão
#    de prefixo que `a.b` e `a` teriam).
# 2. Só caracteres que a PixAntiqua (Latin-1 mais pouquíssimas Extended-A)
#    desenha: nada de `…`, `—`, `•`, aspas curvas ou emoji. O teste de corpus
#    em `gba-desktop::font` transforma a violação em falha, não em `?`.

