_version = 1

# United States English (SPEC-069 L10N-69-01). Must declare exactly the same
# keys as `pt-BR.toml`: `every_locale_declares_the_same_keys` compares the key
# sets and fails otherwise, because the pt-BR fallback would otherwise ship a
# Portuguese sentence inside the English UI.
#
# Same character restriction as pt-BR.toml: the in-window menu draws with
# PixAntiqua, which has no `…` (U+2026), no em dash, no bullets. Write `...`
# and `-`.

