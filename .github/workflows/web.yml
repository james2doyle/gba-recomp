# Web (WebAssembly) target of SPEC-068 TGT-68-02: recompile every free game
# from games/ for wasm32-unknown-emscripten, upload the static sites, attach
# a zip to the GitHub Release on tags v* and deploy the demo to GitHub Pages
# (tags and main).
name: Web

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  EMSDK_VERSION: 6.0.12

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml) and wasm target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-emscripten

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-23.1.3-LLVM-23.1.3-Linux-X64.tar.xz

      - name: LLVM 23.1.3
        run: scripts/ci/setup-llvm.sh LLVM-23.1.3-Linux-X64.tar.xz

      - name: Use LLVM clang as the Rust linker (host build)
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=$LLVM_SYS_231_PREFIX/bin/clang" >> "$GITHUB_ENV"

      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-web-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-web-

      - name: Build gba-recomp (host)
        run: cargo build --release --locked -p gba-recomp

      - name: Build the runtime for wasm32-unknown-emscripten
        run: cargo build --release --locked -p gba-native-rt --target wasm32-unknown-emscripten

      - name: Bundle every free game for the Web
        run: |
          set -euo pipefail
          emcc --version | head -1
          mkdir -p dist/site
          inputs=(--profile-input 200:5:START --profile-input 300:5:A --profile-input 400:60:LEFT --profile-input 500:60:RIGHT)
          for rom in games/*.gba; do
            game=$(basename "$rom" .gba)
            target/release/gba-recomp bundle --rom "$rom" --out "dist/site/$game" \
              --target wasm32-unknown-emscripten \
              --runtime-lib target/wasm32-unknown-emscripten/release/libgba_native_rt.a \
              "${inputs[@]}"
            for f in index.html game.js game.wasm logo.png; do test -s "dist/site/$game/$f"; done
            (cd dist/site && zip -qr "../$game-web.zip" "$game")
          done
          # Project site (site/) with the first game playable in its hero.
          cp site/* dist/site/
          test -s dist/site/rkanoid-v3.00/game.wasm
          ls -la dist dist/site/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/*.zip
          if-no-files-found: error

      - name: Pages artifact
        # The github-pages environment only accepts deployments from main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist
      - name: Attach the Web demo to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
