# Build, test and release gba-recomp and the recompiled demo games
# (SPEC-068 CI-68-01). Tags `v*` publish a GitHub Release with the
# toolchain and the free games from games/ for every platform.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            llvm: LLVM-23.1.3-Linux-X64.tar.xz
            linker_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
          - name: linux-arm64            # Raspberry Pi 4/5, Orange Pi, ARM servers
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            llvm: LLVM-23.1.3-Linux-ARM64.tar.xz
            linker_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            llvm: LLVM-23.1.3-macOS-ARM64.tar.xz
            linker_var: CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER
          # Intel Macs. LLVM 23.1.3 ships no macOS x86-64 binaries, so the
          # Apple Silicon runner cross-builds the runtime, companions, SDL and
          # demo for x86_64-apple-darwin and verifies the demo under Rosetta 2.
          - name: macos-x86_64
            os: macos-15
            target: x86_64-apple-darwin
            cross: x86_64-apple-darwin
            llvm: LLVM-23.1.3-macOS-ARM64.tar.xz
            linker_var: CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            llvm: clang+llvm-23.1.3-x86_64-pc-windows-msvc.tar.xz
            linker_var: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-23.1.3-v2-${{ matrix.llvm }}

      - name: LLVM 23.1.3
        run: scripts/ci/setup-llvm.sh "${{ matrix.llvm }}"

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: SDL 3
        env:
          SDL_ARCH: ${{ matrix.cross == 'x86_64-apple-darwin' && 'x86_64' || '' }}
        run: scripts/ci/setup-sdl3.sh

      - name: Use LLVM clang as the Rust linker
        if: matrix.linker_var != ''
        run: echo "${{ matrix.linker_var }}=$LLVM_SYS_231_PREFIX/bin/clang" >> "$GITHUB_ENV"

      - name: Cross target
        if: matrix.cross
        run: |
          rustup target add "${{ matrix.cross }}"
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=$LLVM_SYS_231_PREFIX/bin/clang" >> "$GITHUB_ENV"
          softwareupdate --install-rosetta --agree-to-license || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --workspace

      - name: Build (host compiler + cross target runtime)
        if: matrix.cross
        run: |
          cargo build --release --locked -p gba-recomp
          cargo build --release --locked --target "${{ matrix.cross }}" \
            -p gba-native-rt -p gba-desktop -p gba-settings -p gba-party -p gba-run

      - name: Test (full suite)
        if: runner.os != 'Windows' && !matrix.cross
        run: cargo test --release --locked --workspace

      - name: Test (cross target under Rosetta)
        if: matrix.cross
        run: cargo test --release --locked --target "${{ matrix.cross }}" -p gba-core -p gba-desktop -p gba-native-rt -p gba-net

      - name: Test (portable crates)
        if: runner.os == 'Windows'
        # The strict-AOT fixtures in gba-recomp/gba-runtime-abi drive clang
        # with Unix linkers; everything else is covered on Windows too.
        run: cargo test --release --locked -p gba-core -p gba-desktop -p gba-native-rt -p gba-net -p gba-settings -p gba-party -p gba-run

      - name: Package toolchain and demo games
        env:
          CROSS_TARGET: ${{ matrix.cross }}
        run: scripts/ci/package.sh "${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            gba-recomp toolchain archives (`gba-recomp-<platform>`) need LLVM 23.1.3 and SDL 3.4 to recompile games.
            Demo archives (`rkanoid-v3.00-<platform>`) are ready to play: the free Rkanoid ROM is embedded, recompiled with LLVM and verified against the interpreter in CI.
