# Android APKs of the free games in games/ (SPEC-068 TGT-68-02, CI-68-01).
# The host gba-recomp emits aarch64-linux-android objects, links them with
# gba-native-rt (built for Android) into libmain.so and wraps SDL3's
# SDLActivity in a Gradle project. APKs are debug-signed, arm64-v8a only.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: android-arm64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml) + Android target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-23.1.3-LLVM-23.1.3-Linux-X64.tar.xz

      - name: LLVM 23.1.3
        run: scripts/ci/setup-llvm.sh LLVM-23.1.3-Linux-X64.tar.xz

      - name: Use LLVM clang as the Rust linker (host)
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=$LLVM_SYS_231_PREFIX/bin/clang" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          clang=$(ls "$ndk"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android24-clang)
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$clang" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME  NDK=$ndk"

      - name: SDL 3 for Android (arm64-v8a)
        run: |
          sudo apt-get install -y -qq ninja-build
          scripts/ci/setup-sdl3-android.sh "$RUNNER_TEMP/sdl3-android"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-android-

      - name: Build gba-recomp (host) and gba-native-rt (host + Android)
        run: |
          cargo build --release --locked -p gba-recomp -p gba-native-rt
          cargo build --release --locked -p gba-native-rt --target aarch64-linux-android

      - name: Adapter unit tests
        run: cargo test --release --locked -p gba-recomp --bin gba-recomp android

      - name: Bundle every free game as an APK
        run: |
          mkdir -p dist
          inputs=(--profile-input 200:5:START --profile-input 300:5:A --profile-input 400:60:LEFT --profile-input 500:60:RIGHT)
          for rom in games/*.gba; do
            game=$(basename "$rom" .gba)
            out="dist/$game-android"
            label="${game%%-v*}"
            GBA_APP_NAME="${label^}" target/release/gba-recomp bundle --rom "$rom" --out "$out" \
              --target aarch64-linux-android \
              --runtime-lib target/aarch64-linux-android/release/libgba_native_rt.a \
              --sdl-dir "$SDL3_ANDROID_DIR" "${inputs[@]}"
            cp "$out/game.apk" "dist/$game-android-arm64.apk"
            unzip -l "dist/$game-android-arm64.apk" | grep -E 'lib/arm64-v8a/lib(main|SDL3)\.so|classes\.dex|AndroidManifest\.xml'
            aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
            "$aapt" dump badging "dist/$game-android-arm64.apk" | grep -E "^(package|application-label|launchable-activity|native-code|sdkVersion|targetSdkVersion)"
            "$(dirname "$aapt")/apksigner" verify --print-certs "dist/$game-android-arm64.apk" | head -3
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-arm64
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
